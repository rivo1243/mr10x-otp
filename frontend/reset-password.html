<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعادة تعيين كلمة المرور — Mr10x</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --border: rgba(255,255,255,0.08);
      --accent: #7c3aed;
      --accent2: #a855f7;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .msg.success {
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.4);
      color: #6ee7b7;
      display: block;
    }
    .msg.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      display: block;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--accent2); }

    /* حالة الطلب (forgot) */
    #forgot-view, #reset-view, #done-view { display: none; }
    #forgot-view.active, #reset-view.active, #done-view.active { display: block; }

    .done-icon {
      font-size: 48px;
      text-align: center;
      margin-bottom: 16px;
    }
    .done-title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .done-sub {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Mr10x</div>

    <!-- ── طلب إعادة تعيين ── -->
    <div id="forgot-view">
      <h1>نسيت كلمة المرور؟</h1>
      <p class="sub">أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة التعيين.</p>
      <label>البريد الإلكتروني</label>
      <input type="email" id="forgot-email" placeholder="example@gmail.com" />
      <button class="btn" id="forgot-btn" onclick="sendReset()">إرسال الرابط</button>
      <div class="msg" id="forgot-msg"></div>
      <a href="/index.html" class="back-link">← العودة لتسجيل الدخول</a>
    </div>

    <!-- ── إدخال كلمة مرور جديدة ── -->
    <div id="reset-view">
      <h1>تعيين كلمة مرور جديدة</h1>
      <p class="sub">أدخل كلمة مرورك الجديدة.</p>
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="new-pass" placeholder="6 أحرف على الأقل" />
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirm-pass" placeholder="أعد كتابة كلمة المرور" />
      <button class="btn" id="reset-btn" onclick="doReset()">تعيين كلمة المرور</button>
      <div class="msg" id="reset-msg"></div>
    </div>

    <!-- ── تم بنجاح ── -->
    <div id="done-view">
      <div class="done-icon">✅</div>
      <div class="done-title">تم تغيير كلمة المرور</div>
      <p class="done-sub">يمكنك الآن تسجيل الدخول بكلمة مرورك الجديدة.</p>
      <a href="/index.html" class="btn" style="display:block;text-align:center;margin-top:24px;text-decoration:none;padding:13px;">
        تسجيل الدخول
      </a>
    </div>
  </div>

  <script>
    const API = '';

    // تحقق من وجود token في الرابط
    const urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) {
      document.getElementById('reset-view').classList.add('active');
    } else {
      document.getElementById('forgot-view').classList.add('active');
    }

    async function sendReset() {
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.getElementById('forgot-btn');
      const msg = document.getElementById('forgot-msg');

      if (!email) return showMsg('forgot-msg', 'أدخل بريدك الإلكتروني', 'error');

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        await fetch(`${API}/api/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        showMsg('forgot-msg', 'تم الإرسال — تحقق من بريدك الإلكتروني (قد يصل في الـ Spam)', 'success');
        btn.textContent = 'تم الإرسال ✓';
      } catch {
        showMsg('forgot-msg', 'حدث خطأ، حاول مرة ثانية', 'error');
        btn.disabled = false;
        btn.textContent = 'إرسال الرابط';
      }
    }

    async function doReset() {
      const pass = document.getElementById('new-pass').value;
      const confirm = document.getElementById('confirm-pass').value;
      const btn = document.getElementById('reset-btn');

      if (!pass || pass.length < 6) return showMsg('reset-msg', 'كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
      if (pass !== confirm) return showMsg('reset-msg', 'كلمتا المرور غير متطابقتين', 'error');

      btn.disabled = true;
      btn.textContent = 'جاري التعيين...';

      const res = await fetch(`${API}/api/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: urlToken, password: pass })
      });
      const data = await res.json();

      if (data.ok) {
        document.getElementById('reset-view').classList.remove('active');
        document.getElementById('done-view').classList.add('active');
      } else {
        showMsg('reset-msg', data.error || 'حدث خطأ', 'error');
        btn.disabled = false;
        btn.textContent = 'تعيين كلمة المرور';
      }
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = `msg ${type}`;
    }

    // إرسال بـ Enter
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (urlToken) doReset();
        else sendReset();
      }
    });
  </script>
</body>
</html>
