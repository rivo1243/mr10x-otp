<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr10x — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --card: #13131c;
    --card2: #1a1a26;
    --border: #252535;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
    --muted2: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Glow ── */
  body::before {
    content: '';
    position: fixed;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(124,58,237,0.1) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Navbar ── */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .navbar-logo {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #a855f7, #7c3aed);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-decoration: none;
  }
  .navbar-right { display: flex; align-items: center; gap: 12px; }
  .seller-name { font-size: 14px; color: var(--muted2); }
  .btn-logout {
    padding: 7px 16px; border-radius: 8px;
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-logout:hover { border-color: var(--red); color: var(--red); }

  /* ── Layout ── */
  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 32px 24px; }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 4px;
    width: fit-content; margin-bottom: 32px;
  }
  .tab-btn {
    padding: 9px 20px; border-radius: 9px; border: none;
    background: transparent; color: var(--muted);
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent); color: #fff;
  }
  .tab-btn:not(.active):hover { color: var(--text); }

  /* ── Section header ── */
  .sec-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .sec-title { font-size: 18px; font-weight: 700; }
  .sec-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* ── Buttons ── */
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 10px;
    background: var(--accent); color: #fff; border: none;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-primary:hover { background: #6d28d9; transform: translateY(-1px); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 9px;
    background: var(--card2); color: var(--muted2); border: 1px solid var(--border);
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px;
    background: transparent; color: var(--red); border: 1px solid rgba(239,68,68,0.3);
    font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn-danger:hover { background: rgba(239,68,68,0.08); }
  .btn-edit {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 7px 10px; border-radius: 8px;
    background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer; transition: all 0.2s;
  }
  .btn-edit:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Stats row ── */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px; margin-bottom: 32px;
  }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 20px 16px;
  }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 28px; font-weight: 800; }
  .stat-value.purple { color: var(--accent2); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.yellow { color: var(--yellow); }

  /* ── Empty state ── */
  .empty {
    text-align: center; padding: 60px 24px;
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .empty-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

  /* ── Slots grid ── */
  .slots-grid {
    display: grid; gap: 14px;
  }
  .slot-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
    transition: border-color 0.2s;
  }
  .slot-card:hover { border-color: rgba(124,58,237,0.4); }
  .slot-status-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .slot-status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .slot-status-dot.exhausted { background: var(--red); }
  .slot-info { flex: 1; min-width: 0; }
  .slot-label { font-size: 15px; font-weight: 700; margin-bottom: 3px; }
  .slot-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .slot-meta span { display: flex; align-items: center; gap: 4px; }
  .slot-attempts {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    white-space: nowrap; flex-shrink: 0;
  }
  .slot-attempts.ok { background: rgba(16,185,129,0.12); color: var(--green); }
  .slot-attempts.warn { background: rgba(245,158,11,0.12); color: var(--yellow); }
  .slot-attempts.none { background: rgba(239,68,68,0.12); color: var(--red); }
  .slot-link-btn {
    padding: 7px 14px; border-radius: 8px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--muted2); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
    white-space: nowrap;
  }
  .slot-link-btn:hover { border-color: var(--accent); color: var(--accent); }
  .slot-actions { display: flex; gap: 8px; align-items: center; }

  /* ── Mailboxes ── */
  .mailbox-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .mailbox-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: var(--card2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-size: 20px;
  }
  .mailbox-info { flex: 1; }
  .mailbox-email { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .mailbox-meta { font-size: 12px; color: var(--muted); }
  .status-badge {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
  }
  .status-badge.connected { background: rgba(16,185,129,0.12); color: var(--green); }
  .status-badge.error { background: rgba(239,68,68,0.12); color: var(--red); }
  .status-badge.pending { background: rgba(245,158,11,0.12); color: var(--yellow); }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px; width: 100%; max-width: 480px;
    transform: translateY(20px); transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--muted2); margin-bottom: 7px; display: block; }
  .form-input {
    width: 100%; padding: 11px 14px;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px;
    font-family: inherit; transition: border-color 0.2s; outline: none;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel {
    padding: 10px 20px; border-radius: 10px;
    background: var(--card2); border: 1px solid var(--border);
    color: var(--muted); font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn-cancel:hover { color: var(--text); }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1e1e2e; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 20px; font-size: 14px; font-weight: 600;
    transition: transform 0.3s; z-index: 9999; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--green); color: var(--green); }
  #toast.error { border-color: var(--red); color: var(--red); }

  /* ── Loading ── */
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Link copy popup ── */
  .link-popup {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .link-popup.open { opacity: 1; pointer-events: all; }
  .link-popup-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px; width: 100%; max-width: 500px;
    transform: translateY(20px); transition: transform 0.2s;
  }
  .link-popup.open .link-popup-box { transform: translateY(0); }
  .link-popup-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
  .link-display {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 12px; color: var(--muted2);
    word-break: break-all; margin-bottom: 14px; direction: ltr; text-align: left;
  }
  .link-popup-btns { display: flex; gap: 10px; }

  @media (max-width: 600px) {
    .page { padding: 20px 16px; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .slot-card { flex-wrap: wrap; }
    .form-row { grid-template-columns: 1fr; }
    .navbar { padding: 0 16px; }
    .seller-name { display: none; }
  }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a class="navbar-logo" href="/">Mr10x</a>
  <div class="navbar-right">
    <span class="seller-name" id="seller-name-display"></span>

</nav>

<div class="page">

  </div>

  <!-- ══ TAB: SLOTS ══ -->
  <div id="tab-slots">
    <div class="stats-row" id="stats-row">

      <div class="stat-card"><div class="stat-label">روابط نشطة</div><div class="stat-value green" id="stat-active">—</div></div>

    </div>

    <div class="sec-header">
      <div>
        <div class="sec-title">الروابط</div>

    <div id="slots-container"><div class="spinner"></div></div>

  <!-- ══ TAB: MAILBOXES ══ -->

<!-- ══ MODAL: New Slot ══ -->
<div class="modal-overlay" id="slot-modal">

    <div class="modal-title">🔗 رابط جديد</div>

    <div class="form-group">

      <label class="form-label">صندوق البريد</label>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">إيميل الحساب (اختياري)</label>

      <div class="form-group">

<!-- ══ MODAL: Edit Slot ══ -->
<div class="modal-overlay" id="edit-slot-modal">
  <div class="modal">

    <div class="form-group">

        <input class="form-input" id="edit-slot-email" placeholder="user@example.com" />

      <div class="form-group">
        <label class="form-label">كلمة مرور الحساب</label>
        <div style="position:relative">
          <input class="form-input" id="edit-slot-pass" type="password" placeholder="••••••••" style="padding-left:38px" />

<!-- ══ MODAL: New Mailbox ══ -->
<div class="modal-overlay" id="mailbox-modal">
  <div class="modal">
    <div class="modal-title">📬 ربط صندوق بريد</div>

    <div class="form-group">
      <label class="form-label">الإيميل</label>
      <input class="form-input" id="mb-email" type="email" placeholder="example@gmail.com" />

    <div class="form-group">
      <label class="form-label">كلمة المرور / App Password</label>

        <input class="form-input" id="mb-pass" type="password" placeholder="••••••••" style="padding-left:38px" />
        <button type="button" onclick="(function(b){const i=document.getElementById('mb-pass');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'})(this)" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;padding:0;line-height:1">👁</button>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeMailboxModal()">إلغاء</button>
      <button class="btn-primary" id="mb-submit-btn" onclick="addMailbox()">ربط الصندوق</button>
    </div>
  </div>
</div>

<!-- ══ LINK POPUP ══ -->
<div class="link-popup" id="link-popup">
  <div class="link-popup-box">
    <div class="link-popup-title">✅ تم إنشاء الرابط</div>
    <div class="link-display" id="link-display-url"></div>
    <div class="link-popup-btns">
      <button class="btn-primary" onclick="copyPopupLink()">نسخ الرابط</button>
      <button class="btn-cancel" style="flex:1" onclick="closeLinkPopup()">إغلاق</button>
    </div>
  </div>
</div>

<div id="toast">تم</div>

<script>
const API = window.MR10X_API || 'https://mr10x-otp-production.up.railway.app';
const FRONT = location.origin;

// ── Auth ───────────────────────────────────────────────────────────────────
function getToken() { return localStorage.getItem('mr10x_token'); }

async function apiFetch(path, opts = {}) {
  const token = getToken();
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(opts.headers || {})
    }
  });
  return res;
}

function logout() {
  localStorage.removeItem('mr10x_token');
  location.href = '/index.html';
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 2800);
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-slots').style.display = name === 'slots' ? '' : 'none';
  document.getElementById('tab-mailboxes').style.display = name === 'mailboxes' ? '' : 'none';
  if (name === 'mailboxes') loadMailboxes();
}

// ── Load slots ─────────────────────────────────────────────────────────────
let slotsCache = [];

async function loadSlots() {
  const container = document.getElementById('slots-container');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const r = await apiFetch('/api/slots');
    if (r.status === 401) { logout(); return; }
    slotsCache = await r.json();
    renderSlots(slotsCache);
    updateStats(slotsCache);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">خطأ في تحميل البيانات</p>';
  }
}

function renderSlots(slots) {
  const container = document.getElementById('slots-container');
  if (!slots.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔗</div>
        <div class="empty-title">لا توجد روابط بعد</div>
        <div class="empty-sub">أنشئ رابطاً لكل عميل من الزر أعلاه</div>
        <button class="btn-primary" onclick="openSlotModal()">+ رابط جديد</button>
      </div>`;
    return;
  }

  const html = slots.map(s => {
    const attempts = typeof s.code_attempts === 'number' ? s.code_attempts : 0;
    const left = Math.max(0, 2 - attempts);
    const attClass = left === 2 ? 'ok' : left === 1 ? 'warn' : 'none';
    const attLabel = left === 0 ? 'استُنفدت' : `${left}/2 محاولة`;
    const isActive = left > 0;
    const slotUrl = `${FRONT}/code.html?t=${s.token}`;
    // F-12: escape user-supplied values before inserting into innerHTML
    const mailMeta = s.mailbox_email ? `📬 ${escHtml(s.mailbox_email)}` : '';
    const emailMeta = s.account_email ? `👤 ${escHtml(s.account_email)}` : '';

    return `
    <div class="slot-card">
      <div class="slot-status-dot ${isActive ? 'active' : 'exhausted'}"></div>
      <div class="slot-info">
        <div class="slot-label">${escHtml(s.label)}</div>
        <div class="slot-meta">
          ${mailMeta ? `<span>${mailMeta}</span>` : ''}
          ${emailMeta ? `<span>${emailMeta}</span>` : ''}
          <span>📅 ${formatDate(s.created_at)}</span>
        </div>
      </div>
      <div class="slot-attempts ${attClass}">${attLabel}</div>
      <div class="slot-actions">
        <button class="slot-link-btn" onclick="showLink('${s.token}')">عرض الرابط</button>
        <button class="btn-edit" title="تعديل" onclick="openEditSlot('${s.id}')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="btn-danger" onclick="deleteSlot('${s.id}', '${escHtml(s.label)}')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `<div class="slots-grid">${html}</div>`;
}

function updateStats(slots) {
  const total = slots.length;
  const exhausted = slots.filter(s => (s.code_attempts || 0) >= 2).length;
  const active = total - exhausted;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-exhausted').textContent = exhausted;
}

// ── Slot modal ─────────────────────────────────────────────────────────────
let mailboxesCache = [];

function openSlotModal() {
  loadMailboxesForSelect();
  document.getElementById('slot-label').value = '';
  document.getElementById('slot-email').value = '';
  document.getElementById('slot-pass').value = '';
  document.getElementById('slot-count').value = '1';
  document.getElementById('slot-err').style.display = 'none';
  document.getElementById('slot-modal').classList.add('open');
  setTimeout(() => document.getElementById('slot-label').focus(), 100);
}
function closeSlotModal() { document.getElementById('slot-modal').classList.remove('open'); }

async function loadMailboxesForSelect() {
  const sel = document.getElementById('slot-mailbox');
  sel.innerHTML = '<option value="">جارٍ التحميل...</option>';
  try {
    const r = await apiFetch('/api/mailboxes');
    const boxes = await r.json();
    mailboxesCache = boxes;
    if (!boxes.length) {
      sel.innerHTML = '<option value="">لا يوجد صندوق بريد — أضف واحداً أولاً</option>';
    } else {
      sel.innerHTML = boxes.map(b =>
        `<option value="${b.id}">${b.email}${b.label ? ' — ' + b.label : ''}</option>`
      ).join('');
    }
  } catch(e) {
    sel.innerHTML = '<option value="">فشل التحميل</option>';
  }
}

async function createSlot() {
  const label = document.getElementById('slot-label').value.trim();
  const mailbox_id = document.getElementById('slot-mailbox').value;
  const account_email = document.getElementById('slot-email').value.trim();
  const account_password = document.getElementById('slot-pass').value;
  const count = parseInt(document.getElementById('slot-count').value) || 1;
  const errEl = document.getElementById('slot-err');

  if (!label) { showErr(errEl, 'اكتب اسم الخدمة'); return; }
  if (!mailbox_id) { showErr(errEl, 'اختر صندوق بريد'); return; }

  const btn = document.getElementById('slot-submit-btn');
  btn.textContent = 'جارٍ الإنشاء...'; btn.disabled = true;
  errEl.style.display = 'none';

  try {
    const r = await apiFetch('/api/slots', {
      method: 'POST',
      body: JSON.stringify({ label, mailbox_id, account_email, account_password, count })
    });
    const data = await r.json();
    if (!r.ok) { showErr(errEl, data.error || 'خطأ'); return; }

    closeSlotModal();
    loadSlots();

    // إظهار الرابط مباشرة إذا كان رابط واحد
    if (data.length === 1) {
      showLinkDirect(data[0].token);
    } else {
      showToast(`✅ تم إنشاء ${data.length} رابط`);
    }
  } catch(e) {
    showErr(errEl, 'خطأ في الاتصال');
  } finally {
    btn.textContent = 'إنشاء الرابط'; btn.disabled = false;
  }
}

// ── Link popup ─────────────────────────────────────────────────────────────
let currentPopupUrl = '';

function showLink(token) {
  currentPopupUrl = `${FRONT}/code.html?t=${token}`;
  document.getElementById('link-display-url').textContent = currentPopupUrl;
  document.getElementById('link-popup').classList.add('open');
}
function showLinkDirect(token) { showLink(token); }
function closeLinkPopup() { document.getElementById('link-popup').classList.remove('open'); }

function copyPopupLink() {
  navigator.clipboard.writeText(currentPopupUrl).then(() => {
    showToast('تم نسخ الرابط ✓');
    closeLinkPopup();
  });
}

// ── Edit slot ──────────────────────────────────────────────────────────────
let editingSlotId = null;

function openEditSlot(id) {
  const slot = slotsCache.find(s => s.id === id);
  if (!slot) return;
  editingSlotId = id;
  document.getElementById('edit-slot-label').value = slot.label || '';
  document.getElementById('edit-slot-email').value = slot.account_email || '';
  document.getElementById('edit-slot-pass').value = '';
  document.getElementById('edit-slot-err').style.display = 'none';
  // إظهار زر reset فقط إذا كانت المحاولات منتهية
  const attempts = typeof slot.code_attempts === 'number' ? slot.code_attempts : 0;
  document.getElementById('edit-reset-btn').style.display = attempts >= 2 ? '' : 'none';
  document.getElementById('edit-slot-modal').classList.add('open');
  setTimeout(() => document.getElementById('edit-slot-email').focus(), 100);
}
function closeEditModal() { document.getElementById('edit-slot-modal').classList.remove('open'); editingSlotId = null; }

async function updateSlot() {
  if (!editingSlotId) return;
  const label = document.getElementById('edit-slot-label').value.trim();
  const account_email = document.getElementById('edit-slot-email').value.trim();
  const account_password = document.getElementById('edit-slot-pass').value;
  const errEl = document.getElementById('edit-slot-err');

  if (!label) { showErr(errEl, 'اكتب اسم الخدمة'); return; }

  const btn = document.getElementById('edit-submit-btn');
  btn.textContent = 'جارٍ الحفظ...'; btn.disabled = true;
  errEl.style.display = 'none';

  const body = { label, account_email };
  if (account_password) body.account_password = account_password;

  try {
    const r = await apiFetch(`/api/slots/${editingSlotId}`, {
      method: 'PATCH',
      body: JSON.stringify(body)
    });
    if (!r.ok) { showErr(errEl, 'فشل الحفظ'); return; }
    closeEditModal();
    showToast('✅ تم حفظ التعديلات');
    loadSlots();
  } catch(e) {
    showErr(errEl, 'خطأ في الاتصال');
  } finally {
    btn.textContent = 'حفظ التعديلات'; btn.disabled = false;
  }
}

async function resetSlotAttempts() {
  if (!editingSlotId) return;
  const btn = document.getElementById('edit-reset-btn');
  btn.textContent = '...'; btn.disabled = true;
  try {
    const r = await apiFetch(`/api/slots/${editingSlotId}/reset`, { method: 'PATCH' });
    if (!r.ok) { showToast('فشل الإعادة', 'error'); return; }
    showToast('✅ تم إعادة ضبط المحاولات');
    btn.style.display = 'none';
    loadSlots();
  } catch(e) { showToast('خطأ', 'error'); }
  finally { btn.textContent = '↺ إعادة ضبط المحاولات'; btn.disabled = false; }
}

// ── Delete slot ────────────────────────────────────────────────────────────
async function deleteSlot(id, label) {
  if (!confirm(`حذف رابط "${label}"؟`)) return;
  try {
    await apiFetch(`/api/slots/${id}`, { method: 'DELETE' });
    showToast('تم الحذف');
    loadSlots();
  } catch(e) { showToast('فشل الحذف', 'error'); }
}

// ── Mailboxes ──────────────────────────────────────────────────────────────
async function loadMailboxes() {
  const container = document.getElementById('mailboxes-container');
  container.innerHTML = '<div class="spinner"></div>';
  try {
    const r = await apiFetch('/api/mailboxes');
    const boxes = await r.json();
    mailboxesCache = boxes;
    renderMailboxes(boxes);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">خطأ</p>';
  }
}

function renderMailboxes(boxes) {
  const container = document.getElementById('mailboxes-container');
  if (!boxes.length) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📬</div>
        <div class="empty-title">لا يوجد صندوق بريد</div>
        <div class="empty-sub">أضف الإيميل اللي فيه أكواد التحقق</div>
        <button class="btn-primary" onclick="openMailboxModal()">+ إضافة صندوق</button>
      </div>`;
    return;
  }

  const html = boxes.map(b => {
    const st = b.status || 'pending';
    const stLabel = st === 'connected' ? 'متصل' : st === 'error' ? 'خطأ' : 'جارٍ الاختبار';
    return `
    <div class="mailbox-card">
      <div class="mailbox-icon">📬</div>
      <div class="mailbox-info">
        <div class="mailbox-email">${escHtml(b.email)}</div>
        <div class="mailbox-meta">${b.label ? escHtml(b.label) + ' · ' : ''}${b.imap_host}:${b.imap_port}</div>
      </div>
      <span class="status-badge ${st}">${stLabel}</span>
      <button class="btn-danger" onclick="deleteMailbox('${b.id}', '${escHtml(b.email)}')">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14H6L5 6M9 6V4h6v2"/></svg>
      </button>
    </div>`;
  }).join('');

  container.innerHTML = `<div class="slots-grid">${html}</div>`;
}

// ── Mailbox modal ──────────────────────────────────────────────────────────
function openMailboxModal() {
  ['mb-email','mb-pass','mb-host','mb-port','mb-label'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('mb-err').style.display = 'none';
  document.getElementById('mailbox-modal').classList.add('open');
  setTimeout(() => document.getElementById('mb-email').focus(), 100);
}
function closeMailboxModal() { document.getElementById('mailbox-modal').classList.remove('open'); }

async function addMailbox() {
  const email = document.getElementById('mb-email').value.trim();
  const password = document.getElementById('mb-pass').value;
  const host = document.getElementById('mb-host').value.trim();
  const port = document.getElementById('mb-port').value.trim();
  const label = document.getElementById('mb-label').value.trim();
  const errEl = document.getElementById('mb-err');

  if (!email) { showErr(errEl, 'أدخل الإيميل'); return; }
  if (!password) { showErr(errEl, 'أدخل كلمة المرور'); return; }

  const btn = document.getElementById('mb-submit-btn');
  btn.textContent = 'جارٍ الاختبار...'; btn.disabled = true;
  errEl.style.display = 'none';

  try {
    const body = { email, password, label };
    if (host) body.host = host;
    if (port) body.port = Number(port);

    const r = await apiFetch('/api/mailboxes', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (!r.ok) { showErr(errEl, data.error || 'فشل الاتصال'); return; }

    closeMailboxModal();
    loadMailboxes();
    showToast('✅ تم ربط الصندوق');
  } catch(e) {
    showErr(errEl, 'خطأ في الاتصال');
  } finally {
    btn.textContent = 'ربط الصندوق'; btn.disabled = false;
  }
}

async function deleteMailbox(id, email) {
  if (!confirm(`حذف صندوق "${email}"؟\nسيتم حذف جميع الروابط المرتبطة به.`)) return;
  try {
    await apiFetch(`/api/mailboxes/${id}`, { method: 'DELETE' });
    showToast('تم الحذف');
    loadMailboxes();
  } catch(e) { showToast('فشل الحذف', 'error'); }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(str) {
  if (!str) return '';
  const d = new Date(str);
  return d.toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
}
function showErr(el, msg) {
  el.textContent = msg; el.style.display = 'block';
}

// ── Close modals on overlay click ─────────────────────────────────────────
document.getElementById('slot-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('slot-modal')) closeSlotModal();
});
document.getElementById('mailbox-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('mailbox-modal')) closeMailboxModal();
});
document.getElementById('link-popup').addEventListener('click', e => {
  if (e.target === document.getElementById('link-popup')) closeLinkPopup();
});

// ── Enter key in modals ────────────────────────────────────────────────────
document.getElementById('slot-pass').addEventListener('keydown', e => { if (e.key === 'Enter') createSlot(); });
document.getElementById('mb-pass').addEventListener('keydown', e => { if (e.key === 'Enter') addMailbox(); });

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  const token = getToken();
  if (!token) { location.href = '/index.html'; return; }

  try {
    const r = await apiFetch('/api/me');
    if (r.status === 401) { logout(); return; }
    const me = await r.json();
    document.getElementById('seller-name-display').textContent = me.name || me.email || '';
  } catch(e) {}

  loadSlots();
}

init();
</script>
</body>
</html>
